name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log

      - name: Fehler anzeigen
        if: failure()
        run: |
          msg=$(grep -E "^e: |What went wrong|^> |error:" -A2 build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build-Fehler::${msg}"

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk CX-Kalender-Manager.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CX-Kalender-Manager
          path: CX-Kalender-Manager.apk

      - name: Als Release veröffentlichen (direkter Download am Handy)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CX Kalender Manager – Build ${{ github.run_number }}
          body: Automatisch gebaut aus ${{ github.sha }}
          files: CX-Kalender-Manager.apk
          make_latest: true
